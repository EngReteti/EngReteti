<svg width="60" height="30" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wrapper {
      transform-origin: 50% 50%;
      animation: rotate3d 6s linear infinite;
    }

    .code {
      font-family: monospace;
      font-weight: bold; /* bold text */
      font-size: 22px;
      fill: #a855f7; /* purple */
    }

    @keyframes rotate3d {
      0%   { transform: scaleX(1) skewY(0deg); }
      25%  { transform: scaleX(0.8) skewY(20deg); }
      50%  { transform: scaleX(1) skewY(0deg); }
      75%  { transform: scaleX(0.8) skewY(-20deg); }
      100% { transform: scaleX(1) skewY(0deg); }
    }
  </style>

  <g class="wrapper">
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="code">
      &lt;&#92;&gt;
    </text>
  </g>
</svg>