<svg width="60" height="30" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Bold red text */
    .code {
      font-family: monospace;
      font-weight: bold;
      font-size: 22px;
      fill: red;
    }

    /* Stroke appearance animation for the backslash */
    .slash {
      stroke: red;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: drawSlash 2s linear infinite;
    }

    @keyframes drawSlash {
      0% { stroke-dashoffset: 20; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 20; }
    }
  </style>

  <!-- Left < and Right > as text -->
  <text x="20" y="20" class="code">&lt;</text>
  <text x="40" y="20" class="code">&gt;</text>

  <!-- Slash as path to animate stroke -->
  <path class="slash" d="M27,10 L33,20" />
</svg>