<svg width="80" height="40" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Bold red text for < and > */
    .code {
      font-family: monospace;
      font-weight: bold;
      font-size: 28px;
      fill: red;
    }

    /* Slash animation: stroke appears and disappears */
    .slash {
      stroke: red;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 15;
      stroke-dashoffset: 15;
      animation: drawSlash 2s linear infinite;
    }

    /* Rotate the whole group */
    .rotate {
      transform-origin: 50% 50%;
      animation: rotateGroup 4s linear infinite;
    }

    @keyframes drawSlash {
      0% { stroke-dashoffset: 15; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 15; }
    }

    @keyframes rotateGroup {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Group containing <, /, > to rotate together -->
  <g class="rotate">
    <!-- Left < -->
    <text x="20" y="30" class="code">&lt;</text>

    <!-- Right > -->
    <text x="60" y="30" class="code">&gt;</text>

    <!-- Animated slash as path -->
    <path class="slash" d="M35,10 L45,30" />
  </g>
</svg>